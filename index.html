<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>STATİK • Asansör Yönetimi</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:980px;margin:auto;padding:18px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center;padding:6px 0 18px}.brand{font-size:34px;font-weight:900}.brand span{color:#469cf7}.sub{color:#9eafc3;font-size:13px}.avatar{width:46px;height:46px;border:1px solid #29425e;border-radius:50%;display:grid;place-items:center;background:#13253a;font-size:23px}.card{background:#101e30;border:1px solid #29425e;border-radius:20px;padding:18px;margin:12px 0}.hero{background:linear-gradient(135deg,#14283f,#0d1a2b)}h1,h2,h3{margin:0 0 10px}.muted{color:#9eafc3}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{min-height:115px}.num{font-size:36px;font-weight:900}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.list{display:grid;gap:10px}.item{background:#0c1929;border:1px solid #243b55;border-radius:14px;padding:14px}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid #31506e;background:#13263c;color:#eef5fc;padding:10px 13px;border-radius:11px}.primary{background:#469cf7;color:#06101c;border-color:#469cf7;font-weight:800}.field{margin:10px 0}.field label{display:block;color:#aab9ca;margin-bottom:6px;font-size:13px}.field input,.field textarea,.field select{width:100%;padding:12px;border-radius:11px;border:1px solid #31506e;background:#091625;color:white;outline:none}.field textarea{min-height:90px}.nav{position:fixed;bottom:0;left:0;right:0;background:#07111fee;border-top:1px solid #243b55;z-index:5}.navin{max-width:980px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{background:none;border:0;color:#91a3b7;padding:11px 3px;font-size:12px}.nav button.active{color:#fff}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(440px,100%)}.logo{font-size:50px;font-weight:900;text-align:center}.logo span{color:#469cf7}.notice{padding:12px;border-radius:12px;background:#172a40;color:#c8d7e6;margin:10px 0}.err{background:#41212a;color:#ffd0d6}.ok{background:#123b2a}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:20}.modal.show{display:flex}.sheet{width:min(620px,100%);max-height:92vh;overflow:auto;background:#0c1929;border:1px solid #29425e;border-radius:22px;padding:20px}.profile-actions{display:grid;gap:10px;margin-top:14px}.profile-actions .btn{width:100%;text-align:left}.profile-title{font-size:20px;font-weight:800}.profile-line{padding:10px 0;border-bottom:1px solid #243b55}.profile-line:last-child{border-bottom:0}@media(min-width:700px){.modal{align-items:center}.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div id="app"></div><script>
const CFG={url:"https://ygmsalcxdyawksnpcuif.supabase.co",key:"sb_publishable_NAv2c-YtrHFE4OoXbbfziQ_4m5MACps"};
const sb=window.supabase.createClient(CFG.url,CFG.key);let session=null,profile=null,active='home',selectedElevator=null;let data={buildings:[],elevators:[],faults:[],maintenances:[]};const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function init(){
  const r=await sb.auth.getSession();
  session=r.data.session;

  sb.auth.onAuthStateChange((event,s)=>{
    session=s;
    if(event==='PASSWORD_RECOVERY'){
      renderPasswordReset();
      return;
    }
    if(s)boot();else renderLogin();
  });

  const hash=new URLSearchParams(location.hash.replace(/^#/,''));
  if(hash.get('type')==='recovery'){
    if(session) renderPasswordReset();
    return;
  }

  if(session)boot();else renderLogin();
}

function renderPasswordReset(){
  document.body.innerHTML=`<div class="login">
    <div class="loginbox">
      <div class="logo">ST<span>ATİK</span></div>
      <div class="sub" style="text-align:center;margin-bottom:18px">ŞİFRE SIFIRLAMA</div>
      <div class="card">
        <h2>Yeni şifre oluştur</h2>
        <p class="muted">Hesabın için yeni şifreni belirle.</p>
        <div class="field">
          <label>Yeni şifre</label>
          <input id="resetPass" type="password" minlength="6" placeholder="En az 6 karakter">
        </div>
        <div class="field">
          <label>Yeni şifre tekrar</label>
          <input id="resetPass2" type="password" minlength="6" placeholder="Şifreyi tekrar yaz">
        </div>
        <button class="btn primary" style="width:100%" onclick="resetPassword()">Şifreyi Güncelle</button>
      </div>
    </div>
  </div>`;
}

async function resetPassword(){
  const a=$('#resetPass').value;
  const b=$('#resetPass2').value;
  if(a.length<6)return alert('Şifre en az 6 karakter olmalı.');
  if(a!==b)return alert('Şifreler aynı değil.');

  const r=await sb.auth.updateUser({password:a});
  if(r.error)return alert(r.error.message);

  alert('Şifren başarıyla güncellendi. Şimdi yeni şifrenle giriş yapabilirsin.');
  await sb.auth.signOut();
  history.replaceState({},document.title,location.pathname);
  renderLogin();
}
async function boot(){const r=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();if(r.error)return renderError(r.error.message);profile=r.data;if(!profile||!profile.company_id){return renderCompanySetup()}await load();render()}
async function load(){const [b,e,f,m]=await Promise.all([sb.from('buildings').select('*').order('created_at',{ascending:false}),sb.from('elevators').select('*, buildings(name)').order('created_at',{ascending:false}),sb.from('faults').select('*, elevators(serial_number, buildings(name))').order('created_at',{ascending:false}),sb.from('maintenances').select('*, elevators(serial_number, buildings(name))').order('planned_date',{ascending:true})]);data={buildings:b.data||[],elevators:e.data||[],faults:f.data||[],maintenances:m.data||[]}}
function renderLogin(){document.body.innerHTML=`<div class="login"><div class="loginbox"><div class="logo">ST<span>ATİK</span></div><div class="sub" style="text-align:center;margin-bottom:18px">ASANSÖR YÖNETİM UYGULAMASI</div><div class="card"><div class="btns"><button class="btn primary" id="tabL" onclick="authTab('l')">Giriş</button><button class="btn" id="tabS" onclick="authTab('s')">Kayıt Ol</button></div><div id="auth"></div></div></div></div>`;authTab('l')}
function authTab(x){$('#tabL').classList.toggle('primary',x==='l');$('#tabS').classList.toggle('primary',x==='s');$('#auth').innerHTML=x==='l'?`<div class="field"><label>E-posta</label><input id="email" type="email"></div><div class="field"><label>Şifre</label><input id="pass" type="password"></div><button class="btn primary" style="width:100%" onclick="login()">Giriş Yap</button><button class="btn" style="width:100%;margin-top:8px" onclick="sendPasswordReset()">🔐 Şifremi Unuttum</button>`:`<div class="field"><label>Ad Soyad</label><input id="name"></div><div class="field"><label>Firma Adı</label><input id="company"></div><div class="field"><label>E-posta</label><input id="email" type="email"></div><div class="field"><label>Şifre</label><input id="pass" type="password"></div><button class="btn primary" style="width:100%" onclick="signup()">Kayıt Ol</button>`}
async function login(){const {error}=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#pass').value});if(error)alert(error.message)}
async function signup(){const name=$('#name').value.trim(),company=$('#company').value.trim(),email=$('#email').value.trim(),password=$('#pass').value;if(!name||!company||!email||password.length<6)return alert('Tüm alanları doldur; şifre en az 6 karakter.');const r=await sb.auth.signUp({email,password,data:{full_name:name}});if(r.error)return alert(r.error.message);if(!r.data.user)return alert('Kayıt oluşturulamadı.');localStorage.setItem('statik_pending_company',company);if(r.data.session){alert('Kayıt tamamlandı. Firma kurulumu açılıyor.');boot()}else{alert('Kayıt oluşturuldu. E-posta adresine gelen doğrulama bağlantısına tıkla. Sonra Giriş Yap bölümünden giriş yap.');authTab('l')}}
function renderCompanySetup(){const pending=localStorage.getItem('statik_pending_company')||'';document.body.innerHTML=`<div class="login"><div class="loginbox card"><div class="logo">ST<span>ATİK</span></div><h2>Firma kurulumu</h2><p class="muted">Hesabın hazır. Firma bilgilerini tamamlayalım.</p><div class="field"><label>Firma adı</label><input id="cname" value="${esc(pending)}"></div><button class="btn primary" style="width:100%" onclick="createCompany()">Firmayı Oluştur</button><button class="btn" style="width:100%;margin-top:8px" onclick="logout()">Çıkış</button></div></div>`}
async function createCompany(){const n=$('#cname').value.trim();if(!n)return alert('Firma adını yaz.');if(!session)return alert('Oturum bulunamadı. Önce giriş yap.');const r=await sb.rpc('create_company_owner',{p_name:n,p_full_name:session.user.user_metadata?.full_name||session.user.email});if(r.error)alert(r.error.message);else{localStorage.removeItem('statik_pending_company');boot()}}
function renderError(e){document.body.innerHTML=`<div class="login"><div class="loginbox card"><h2>Bağlantı hatası</h2><div class="notice err">${esc(e)}</div></div></div>`}
function nav(k,i,t){return `<button class="${active===k?'active':''}" onclick="go('${k}')">${i}<br>${t}</button>`}function go(k){active=k;renderView();document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',['home','buildings','elevators','faults','maintenance'][i]===k))}
function render(){document.body.innerHTML=`<div class="wrap"><div class="top"><div><div class="brand">ST<span>ATİK</span></div><div class="sub">ASANSÖR YÖNETİM UYGULAMASI</div></div><button class="avatar" aria-label="Profil menüsü" onclick="profileMenu()">👤</button></div><div id="view"></div></div><div class="nav"><div class="navin">${nav('home','⌂','Ana Sayfa')}${nav('buildings','🏢','Binalar')}${nav('elevators','🛗','Asansörler')}${nav('faults','⚠️','Arızalar')}${nav('maintenance','🔧','Bakım')}</div></div>`;renderView()}
function renderView(){const v=$('#view');if(active==='home')home(v);if(active==='buildings')buildings(v);if(active==='elevators')elevators(v);if(active==='faults')faults(v);if(active==='maintenance')maintenance(v)}
function home(v){const open=data.faults.filter(x=>!['RESOLVED','CLOSED'].includes(x.status)).length;v.innerHTML=`<div class="card hero"><h1>Merhaba, ${esc(profile?.full_name||'Yönetici')} 👋</h1><p class="muted">Asansörlerinizi tek yerden takip edin.</p><div class="btns"><button class="btn primary" onclick="go('buildings')">🏢 Binalar</button><button class="btn" onclick="go('faults')">⚠️ Arıza</button></div></div><div class="grid"><div class="card stat"><div>🏢</div><div class="num">${data.buildings.length}</div><div class="muted">Bina</div></div><div class="card stat"><div>🛗</div><div class="num">${data.elevators.length}</div><div class="muted">Asansör</div></div><div class="card stat"><div>🔧</div><div class="num">${data.maintenances.filter(x=>x.status!=='COMPLETED').length}</div><div class="muted">Bekleyen bakım</div></div><div class="card stat"><div>⚠️</div><div class="num">${open}</div><div class="muted">Açık arıza</div></div></div>`}
function buildings(v){v.innerHTML=`<div class="row"><h2>Binalar</h2><button class="btn primary" onclick="modal('b')">+ Bina</button></div><div class="list">${data.buildings.map(b=>`<div class="item"><b>🏢 ${esc(b.name)}</b><div class="muted">${esc(b.address||'Adres yok')}</div><div class="muted">${esc(b.manager_name||'')} ${esc(b.manager_phone||'')}</div></div>`).join('')||'<div class="card muted">Henüz bina yok.</div>'}</div>`}
function elevators(v){v.innerHTML=`<div class="row"><h2>Asansörler</h2><button class="btn primary" onclick="modal('e')">+ Asansör</button></div><div class="list">${data.elevators.map(e=>`<div class="item" style="cursor:pointer" onclick="showElevator('${e.id}')"><b>🛗 ${esc(e.name)}</b><div class="muted">${esc(e.buildings?.name||'')} • ${esc(e.serial_number||'')}</div><div class="muted">${esc(e.model||'')} • ${e.floors||'-'} durak • ${e.capacity||'-'} kg</div><div class="muted" style="margin-top:8px">Detayları görmek için dokun →</div></div>`).join('')||'<div class="card muted">Henüz asansör yok.</div>'}</div>`}
function showElevator(id){const e=data.elevators.find(x=>x.id===id);if(!e)return;selectedElevator=e;document.body.insertAdjacentHTML('beforeend',`<div class="modal show" id="elevatorModal"><div class="sheet"><div class="row"><h2>🛗 Asansör Detayı</h2><button class="btn" onclick="closeElevator()">✕</button></div><div class="card"><h3>${esc(e.name||'Asansör')}</h3><div class="profile-line"><span class="muted">Bina</span><br>${esc(e.buildings?.name||'-')}</div><div class="profile-line"><span class="muted">Seri No</span><br>${esc(e.serial_number||'-')}</div><div class="profile-line"><span class="muted">Model</span><br>${esc(e.model||'-')}</div><div class="profile-line"><span class="muted">Durak</span><br>${e.floors||'-'}</div><div class="profile-line"><span class="muted">Kapasite</span><br>${e.capacity||'-'} kg</div><div class="profile-line"><span class="muted">QR Kodu</span><br>${esc(e.qr_code||'-')}</div></div><div class="btns"><button class="btn primary" onclick="alert('Arıza bildirimi sonraki adımda eklenecek.')">⚠️ Arıza Bildir</button><button class="btn" onclick="alert('Bakım geçmişi sonraki adımda eklenecek.')">🔧 Bakım Geçmişi</button></div><button class="btn" style="width:100%;margin-top:10px" onclick="closeElevator()">Kapat</button></div></div>`)}function closeElevator(){$('#elevatorModal')?.remove();selectedElevator=null}
function faults(v){v.innerHTML=`<div class="row"><h2>Arızalar</h2><button class="btn primary" onclick="modal('f')">+ Arıza</button></div><div class="list">${data.faults.map(f=>`<div class="item"><div class="row"><b>⚠️ ${esc(f.title)}</b><span class="muted">${esc(f.status)}</span></div><div class="muted">${esc(f.elevators?.buildings?.name||'')} • ${esc(f.elevators?.serial_number||'')}</div><div>${esc(f.description||'')}</div></div>`).join('')||'<div class="card muted">Henüz arıza yok.</div>'}</div>`}
function maintenance(v){v.innerHTML=`<div class="row"><h2>Bakım</h2><button class="btn primary" onclick="modal('m')">+ Bakım</button></div><div class="list">${data.maintenances.map(m=>`<div class="item"><div class="row"><b>🔧 ${esc(m.elevators?.serial_number||'')}</b><span class="muted">${esc(m.status)}</span></div><div class="muted">${esc(m.elevators?.buildings?.name||'')} • ${m.planned_date||''}</div><div>${esc(m.notes||'')}</div></div>`).join('')||'<div class="card muted">Henüz bakım yok.</div>'}</div>`}
function modal(t){let h='';if(t==='b')h=`<h2>Yeni Bina</h2><div class="field"><label>Bina adı</label><input id="n"></div><div class="field"><label>Adres</label><input id="a"></div><div class="field"><label>Yönetici</label><input id="mn"></div><div class="field"><label>Telefon</label><input id="mp"></div><button class="btn primary" onclick="saveB()">Kaydet</button>`;if(t==='e')h=`<h2>Yeni Asansör</h2><div class="field"><label>Bina</label><select id="bid">${data.buildings.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div><div class="field"><label>Asansör adı</label><input id="en"></div><div class="field"><label>Seri no</label><input id="sn"></div><div class="field"><label>Model</label><input id="mo"></div><div class="field"><label>Durak</label><input id="fl" type="number"></div><div class="field"><label>Kapasite</label><input id="cp" type="number"></div><button class="btn primary" onclick="saveE()">Kaydet</button>`;if(t==='f')h=`<h2>Arıza Bildir</h2><div class="field"><label>Asansör</label><select id="eid">${data.elevators.map(e=>`<option value="${e.id}">${esc(e.name)} • ${esc(e.serial_number||'')}</option>`).join('')}</select></div><div class="field"><label>Başlık</label><input id="ft"></div><div class="field"><label>Açıklama</label><textarea id="fd"></textarea></div><button class="btn primary" onclick="saveF()">Kaydet</button>`;if(t==='m')h=`<h2>Bakım Planla</h2><div class="field"><label>Asansör</label><select id="eid">${data.elevators.map(e=>`<option value="${e.id}">${esc(e.name)} • ${esc(e.serial_number||'')}</option>`).join('')}</select></div><div class="field"><label>Tarih</label><input id="pd" type="date"></div><div class="field"><label>Not</label><textarea id="pn"></textarea></div><button class="btn primary" onclick="saveM()">Kaydet</button>`;document.body.insertAdjacentHTML('beforeend',`<div class="modal show" id="modal"><div class="sheet">${h}<button class="btn" style="width:100%;margin-top:8px" onclick="closeM()">Kapat</button></div></div>`)}function closeM(){$('#modal')?.remove()}
async function saveB(){const r=await sb.from('buildings').insert({company_id:profile.company_id,name:$('#n').value,address:$('#a').value,manager_name:$('#mn').value,manager_phone:$('#mp').value});if(r.error)alert(r.error.message);else{closeM();await load();render()}}
async function saveE(){const r=await sb.from('elevators').insert({company_id:profile.company_id,building_id:$('#bid').value,name:$('#en').value,serial_number:$('#sn').value,model:$('#mo').value,floors:+$('#fl').value||null,capacity:+$('#cp').value||null,qr_code:crypto.randomUUID()});if(r.error)alert(r.error.message);else{closeM();await load();render()}}
async function saveF(){const r=await sb.from('faults').insert({company_id:profile.company_id,elevator_id:$('#eid').value,reported_by:session.user.id,title:$('#ft').value,description:$('#fd').value});if(r.error)alert(r.error.message);else{closeM();await load();render()}}
async function saveM(){const r=await sb.from('maintenances').insert({company_id:profile.company_id,elevator_id:$('#eid').value,planned_date:$('#pd').value,notes:$('#pn').value});if(r.error)alert(r.error.message);else{closeM();await load();render()}}
function profileMenu(){document.body.insertAdjacentHTML('beforeend',`<div class="modal show" id="profileModal"><div class="sheet"><div class="profile-title">👤 Profil ve Hesap</div><div class="profile-actions"><button class="btn" onclick="showProfile()">👤 Profilim</button><button class="btn" onclick="showPasswordChange()">🔐 Şifre değiştir</button><button class="btn" style="border-color:#7b3340;color:#ffd7dc" onclick="logout()">🚪 Çıkış Yap</button><button class="btn" onclick="closeProfileModal()">Kapat</button></div></div></div>`)}
function closeProfileModal(){$('#profileModal')?.remove()}
function showProfile(){document.body.insertAdjacentHTML('beforeend',`<div class="modal show" id="profileInfoModal"><div class="sheet"><h2>Profilim</h2><div class="profile-line"><span class="muted">Ad Soyad</span><br>${esc(profile?.full_name||'Yönetici')}</div><div class="profile-line"><span class="muted">E-posta</span><br>${esc(session?.user?.email||'')}</div><div class="profile-line"><span class="muted">Rol</span><br>${esc(profile?.role||'ADMIN')}</div><button class="btn" style="width:100%;margin-top:14px" onclick="$('#profileInfoModal')?.remove()">Kapat</button></div></div>`)}
function showPasswordChange(){document.body.insertAdjacentHTML('beforeend',`<div class="modal show" id="passwordModal"><div class="sheet"><h2>Şifre değiştir</h2><div class="field"><label>Yeni şifre</label><input id="newPass" type="password" minlength="6" placeholder="En az 6 karakter"></div><div class="field"><label>Yeni şifre tekrar</label><input id="newPass2" type="password" minlength="6" placeholder="Şifreyi tekrar yaz"></div><div class="btns"><button class="btn primary" onclick="changePassword()">Şifreyi Güncelle</button><button class="btn" onclick="$('#passwordModal')?.remove()">İptal</button></div></div></div>`)}
async function changePassword(){const a=$('#newPass').value,b=$('#newPass2').value;if(a.length<6)return alert('Şifre en az 6 karakter olmalı.');if(a!==b)return alert('Şifreler aynı değil.');const r=await sb.auth.updateUser({password:a});if(r.error)return alert(r.error.message);$('#passwordModal')?.remove();$('#profileModal')?.remove();alert('Şifren başarıyla güncellendi.')}
async function logout(){closeProfileModal();const r=await sb.auth.signOut();if(r.error)alert(r.error.message)}init();
</script></body></html>
